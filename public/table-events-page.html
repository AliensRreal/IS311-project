<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="bootstrap.css" />
    <link rel="stylesheet" href="W-styles.css" />
    <link rel="stylesheet" href="styles.css" />
    <title>Events Table</title>
  </head>
  <body>
    <header>
      <div class="container-fluid mt-4">
          <div class="row">
              <div class="col-3">
                  <a href="index.html"><img class="W-logo ms-3" src="images/966f4bce-da5d-47d8-bdd4-c0e5f6291a68.jpeg"></a>
              </div>
              <div class="col-3"></div>
                  <div class="col-6 align-content-center">
                      <div class="W-containernav">
                          <div class="W-navbox">
                              <nav>
                                  <a href="index.html">Home</a>
                                  <a href="aboutus.html">About Us</a>
                                  <a href="contactus.html" target="_blank">Contact Us</a>
                                  <a href="registeration-page.html" target="_blank">Join Us</a>
                                  <a href="signin-page.html" target="_blank">Sign In</a>
                              </nav>
                          </div>
                      </div>
                  </div>
              </div>
          </div>
      </div>
  </header>
    <div class="flex-col" style="height: 90vh">
      <h2 class="h2 text-light">Events List</h2>
      <div class="container" id="table-holder"></div>
      <hr />
      <div class="text-center">

        <div class="row">
          <div class="col p-0 me-2 mt-2 btn btn-outline-light">Add Event</div>
          <div class="col p-0 ms-2 mt-2 btn btn-danger">Remove Event</div>
        </div>
        </div>
        <ul class="pagination mt-6 m-0 text-center p-0">
          <li class="page-item">
            <a href="table-members-page.html" class="page-link bg-dark text-light"><div class="text-center" style="width: 100px; font-size: 11px;">&lt; Members</div></a>
          </li>
          <li class="page-item">
            <a href="table-events-page.html" class="page-link bg-dark text-light"><div class="text-center" style="width: 100px;font-size: 11px;">Events &gt;</div></a>
          </li>
        </ul>
     

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script>
      getEventData();

      function getEventData(){
        fetch('/data/events')
        .then(res => res.json())
        .then( data => {
          let htmlString = `<tr><th>EID</th><th>Name</th><th>Date</th><th>Duration</th><th>Location</th><th>Type</th><th>Description</th></tr>`
          for(d in data){
            htmlString += `<tr>
              <td>${data[d].EVENT_ID}</td>
              <td>${data[d].EVENT_NAME}</td>
              <td>${data[d].EVENT_DATE}</td>
              <td>${data[d].EVENT_DURATION}</td>
              <td>${data[d].EVENT_LOCATION}</td>
              <td>${data[d].EVENT_TYPE}</td>
              <td>${data[d].EVENT_DISCRIPTION}</td>
              </tr>`
          }
          document.getElementById('table-holder').innerHTML = `<table class="table table-striped table-hover bg-light">${htmlString}</table>`
        } )
      }

      function getEvent(){
        let id = document.getElementById('eid').value
        fetch('/data/events/' + id)
        .then(res => res.json())
        .then( data => {
          {
            document.getElementById('event-name').value = data.EVENT_NAME
            document.getElementById('event-date').value = data.EVENT_DATE
            document.getElementById('event-duration').value = data.EVENT_DURATION
            document.getElementById('event-location').value = data.EVENT_LOCATION
            document.getElementById('event-type').value = data.EVENT_TYPE
            document.getElementById('event-discription').value = data.EVENT_DISCRIPTION
          }
          })
        }
      

      function updateEvent(){
        let id = document.getElementById('eid').value
        fetch('/data/events/' + id, {
          method: PUT,
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            event_name: document.getElementById('event-name').value,
            event_date: document.getElementById('event-date').value,
            event_duration: document.getElementById('event-duration').value,
            event_location: document.getElementById('event-location').value,
            event_type: document.getElementById('event-type').value,
            event_discription: document.getElementById('event-discription').value
          })
        })
      }

      function deleteEvent(){
        let id = document.getElementById('eid').value
        fetch('/data/events/' + id, {
          method: DELETE
        })
      }
    </script>
  </body>
</html>
