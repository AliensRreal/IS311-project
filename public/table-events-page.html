<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="bootstrap.css" />
    <link rel="stylesheet" href="W-styles.css" />
    <link rel="stylesheet" href="styles.css" />
    <title>Events Table</title>
  </head>
  <body style="height: 200vh;">
    <header>
      <div class="container-fluid mt-4">
          <div class="row">
              <div class="col-3">
                  <a href="index.html"><img class="W-logo ms-3" src="images/966f4bce-da5d-47d8-bdd4-c0e5f6291a68.jpeg"></a>
              </div>
              <div class="col-3"></div>
                  <div class="col-6 align-content-center">
                      <div class="W-containernav">
                          <div class="W-navbox">
                              <nav>
                                  <a href="index.html">Home</a>
                                  <a href="aboutus.html">About Us</a>
                                  <a href="contactus.html" target="_blank">Contact Us</a>
                                  <a href="registeration-page.html" target="_blank">Join Us</a>
                                  <a href="signin-page.html" target="_blank">Sign In</a>
                              </nav>
                          </div>
                      </div>
                  </div>
              </div>
          </div>
      </div>
  </header>
    <div class="flex-col" style="height: 60vh">
      <h2 class="h2 text-light">Events List</h2>
      <div class="container" id="tbl"></div>
      <hr />
      <div class="text-center">

        
        </div>
        <ul class="pagination mt-6 m-0 text-center p-0">
          <li class="page-item">
            <a href="table-members-page.html" class="page-link bg-dark text-light"><div class="text-center" style="width: 100px; font-size: 11px;">&lt; Members</div></a>
          </li>
          <li class="page-item">
            <a href="table-events-page.html" class="page-link bg-dark text-light"><div class="text-center" style="width: 100px;font-size: 11px;">Events &gt;</div></a>
          </li>
        </ul>
      </div>
        <div
      class="container bg-dark text-light rounded-3 p-4"
      style="max-width: 600px; margin: auto"
    >
      <h3 class="text-center mb-4">Event Search Portal</h3>
      <form id="eventForm">
        <div
          id="statusIndicator"
          class="text-center mb-3 p-2 rounded bg-info text-dark"
          style="display: none"
        ></div>

        <div class="mb-3">
          <label for="eid" class="form-label">Event ID:</label>
          <input
            type="text"
            id="eid"
            class="form-control bg-secondary text-light border-0"
            placeholder="ex: 1234567"
          />
        </div>
        <div class="mb-3">
          <label for="event-name" class="form-label">Event Name:</label>
          <div class="d-flex gap-2">
            <input 
              type="text"
              id="event-name"
              class="form-control bg-secondary text-light border-0"
              placeholder="First Name"
            />
          </div>
          </div>
        <div class="mb-3 ">
          <label for="event-date" class="form-label">Event Date:</label>
          <div class="d-flex gap-2">
           
            <input 
              type="text"
              id="event-date"
              class="form-control bg-secondary text-light border-0"
              placeholder="Last Name"
            />
          </div>
        </div>
        <div class="mb-3">
          <label for="event-duration" class="form-label">Event Duration:</label>
          <input 
            type="text"
            id="event-duration"
            class="form-control bg-secondary text-light border-0"
            placeholder="ex: Manager"
          />
        </div>
        <div class="mb-3">
          <label for="event-location" class="form-label">Event Location:</label>
          <input 
            type="text"
            id="event-location"
            class="form-control bg-secondary text-light border-0"
            placeholder="example@example.com"
          />
        </div>
        <div class="mb-3">
          <label for="event-type" class="form-label">Event Type:</label>
          <input 
            type="text"
            id="event-type"
            class="form-control bg-secondary text-light border-0"
            placeholder="0512345678"
          />
        </div>
        <div class="mb-3">
          <label for="event-discription" class="form-label">Event Discription:</label>
          <input 
            Devent-discription="text"
            id="event-discription"
            class="form-control bg-secondary text-light border-0"
            placeholder="0512345678"
          />
        </div>
        <div class="d-flex justify-content-between flex-wrap gap-2">
          <button type="button" id="searchBtn" onclick="getEvent();enabler()" class="btn btn-secondary">
            Search
          </button>
          <button type="button" id="addBtn" onclick="addEvent()" class="btn btn-secondary">
            Add
          </button>
          <button type="button" id="editBtn" onclick="updateEvent()" disabled class="btn btn-secondary">
            Edit
          </button>
          <button type="button" id="deleteBtn" onclick="deleteEvent()" disabled class="btn btn-secondary">
            Delete
          </button>
          <button type="button" id="resetBtn" onclick="cleaner()"  class="btn btn-secondary">
            Reset
          </button>
          <button
            type="button"
            id="goBackBtn"
            class="btn btn-secondary"
            style="display: none"
          >
            Go Back
          </button>
          <button
            type="submit"
            id="submitBtn"
            class="btn btn-secondary"
            style="display: none"
          >
            Submit
          </button>
        </div>
      </form>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script>
     
      getEventData();
      function cleaner(){
          document.getElementById('eid').disabled=false; 
            document.getElementById('eid').value= '';
            document.getElementById('event-name').value = '';
            document.getElementById('event-date').value = '';
            document.getElementById('event-duration').value ='';
            document.getElementById('event-location').value = '';
            document.getElementById('event-type').value ='';
            document.getElementById('event-discription').value = '';
            document.getElementById("deleteBtn").disabled=true;
            document.getElementById("editBtn").disabled=true;
      }
      function enabler(){
            document.getElementById('eid').disabled = !document.getElementById('eid').disabled;
            document.getElementById('event-name').disabled = false;
            document.getElementById('event-date').disabled = false;
            document.getElementById('event-duration').disabled =false;
            document.getElementById('event-location').disabled = false;
            document.getElementById('event-type').disabled =false;
            document.getElementById('event-discription').disabled = false;
      }
      function getEventData(){
        fetch('/data/events')
        .then(res => res.json())
        .then( data => {
          let htmlString = `<tr><th>EID</th><th>Name</th><th>Location</th><th>Type</th></tr>`
          for(d in data){
            htmlString += `<tr>
              <td>${data[d].EVENT_ID}</td>
              <td>${data[d].EVENT_NAME}</td>
              <td>${data[d].EVENT_LOCATION}</td>
              <td>${data[d].EVENT_TYPE}</td>
              </tr>`
          }
          console.log(htmlString);
          document.getElementById('tbl').innerHTML = `<table class="table table-striped table-hover bg-light">${htmlString}</table>`
        } )
      }

      function getEvent(){
        let id = document.getElementById('eid').value
        fetch('/data/events/' + id)
        .then(res => res.json())
        .then( data => {
          {
            console.log(data)
            document.getElementById('event-name').value = data[0].EVENT_NAME
            document.getElementById('event-date').value = data[0].EVENT_DATE
            document.getElementById('event-duration').value = data[0].EVENT_DURATION
            document.getElementById('event-location').value = data[0].EVENT_LOCATION
            document.getElementById('event-type').value = data[0].EVENT_TYPE
            document.getElementById('event-discription').value = data[0].EVENT_DISCRIPTION

          }
          })
          document.getElementById("deleteBtn").disabled=false;
          document.getElementById("editBtn").disabled=false;
        }
      

      function updateEvent(){
        let id = document.getElementById('eid').value
        fetch('/data/events/' + id, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            event_name: document.getElementById('event-name').value,
            event_date: document.getElementById('event-date').value,
            event_duration: document.getElementById('event-duration').value,
            event_location: document.getElementById('event-location').value,
            event_type: document.getElementById('event-type').value,
            event_discription: document.getElementById('event-discription').value
          })
        })
        getEventData();
      }

      function deleteEvent(){
        let id = document.getElementById('eid').value
        fetch('/data/events/' + id, {
          method: 'DELETE'
        })
        getEventData();
      }
      function addEvent(){
        let event = {
          event_name: document.getElementById('event-name').value,
            event_date: document.getElementById('event-date').value,
            event_duration: document.getElementById('event-duration').value,
            event_location: document.getElementById('event-location').value,
            event_type: document.getElementById('event-type').value,
            event_discription: document.getElementById('event-discription').value
        };
        fetch('/data/events', {
          method:'POST',
          body: JSON.stringify({
             event_name: event.event_name,
             event_date: event.event_date,
             event_duration: event.event_duration,
             event_location: event.event_location,
             event_type: event.event_type,
             event_discription: event.event_discription
          }),
          headers: {
            'Content-Type': 'application/json'
          }
        })
        .then(res => res.json())
          .then(data =>{
             alert(data.respond);
          })
          getEventData();

      }
    </script>
  </body>
</html>
