<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Search Portal</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-black text-light">
    <header class="mb-4">
      <div class="container-fluid mt-4">
        <div class="row">
          <div class="col-3">
            <a href="index.html"
              ><img class="W-logo ms-3" src="" alt="Logo"
            /></a>
          </div>
          <div class="bg-dark col-6 text-center rounded-3">
            <nav class="nav justify-content-center">
              <a href="index.html" class="nav-link text-light">Home</a>
              <a href="aboutus.html" class="nav-link text-light">About Us</a>
              <a
                href="contactus.html"
                class="nav-link text-light"
                target="_blank"
                >Contact Us</a
              >
              <a
                href="registeration-page.html"
                class="nav-link text-light"
                target="_blank"
                >Join Us</a
              >
              <a
                href="signin-page.html"
                class="nav-link text-light"
                target="_blank"
                >Sign In</a
              >
            </nav>
          </div>
        </div>
      </div>
    </header>

    <div
      class="container bg-dark text-light rounded-3 p-4"
      style="max-width: 600px; margin: auto"
    >
      <h3 class="text-center mb-4">Students Search Portal</h3>
      <form id="studentForm">
        <div
          id="statusIndicator"
          class="text-center mb-3 p-2 rounded bg-info text-dark"
          style="display: none"
        ></div>

        <div class="mb-3">
          <label for="mid" class="form-label">Member ID:</label>
          <input
            type="text"
            id="mid"
            class="form-control bg-secondary text-light border-0"
            placeholder="ex: 1234567"
          />
        </div>
        <div class="mb-3">
          <label for="first-name" class="form-label">Student Name:</label>
          <div class="d-flex gap-2">
            <input
              type="text"
              id="first-name"
              class="form-control bg-secondary text-light border-0"
              placeholder="First Name"
            />
            <input
              type="text"
              id="last-name"
              class="form-control bg-secondary text-light border-0"
              placeholder="Last Name"
            />
          </div>
        </div>
        <div class="mb-3">
          <label for="role" class="form-label">Role:</label>
          <input
            type="text"
            id="role"
            class="form-control bg-secondary text-light border-0"
            placeholder="ex: Manager"
          />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email:</label>
          <input
            type="email"
            id="email"
            class="form-control bg-secondary text-light border-0"
            placeholder="example@example.com"
          />
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">Phone Number:</label>
          <input
            type="text"
            id="phone"
            class="form-control bg-secondary text-light border-0"
            placeholder="0512345678"
          />
        </div>
        <div class="d-flex justify-content-between flex-wrap gap-2">
          <button type="button" id="searchBtn" class="btn btn-secondary">
            Search
          </button>
          <button type="button" id="addBtn" class="btn btn-secondary">
            Add
          </button>
          <button type="button" id="editBtn" class="btn btn-secondary">
            Edit
          </button>
          <button type="button" id="deleteBtn" class="btn btn-secondary">
            Delete
          </button>
          <button
            type="button"
            id="goBackBtn"
            class="btn btn-secondary"
            style="display: none"
          >
            Go Back
          </button>
          <button
            type="submit"
            id="submitBtn"
            class="btn btn-secondary"
            style="display: none"
          >
            Submit
          </button>
        </div>
      </form>
    </div>

    <!-- BOOTSTRAP JS BUNDLE -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JAVASCRIPT FUNCTIONALITY -->
    <script>
      // SELECTING FORM ELEMENTS
      const formFields = {
        firstName: document.getElementById("first-name"),
        lastName: document.getElementById("last-name"),
        email: document.getElementById("email"),
        phone: document.getElementById("phone"),
        role: document.getElementById("role"),
        studentId: document.getElementById("mid"),
      };

      // SELECTING BUTTON ELEMENTS
      const searchBtn = document.getElementById("searchBtn");
      const addBtn = document.getElementById("addBtn");
      const editBtn = document.getElementById("editBtn");
      const deleteBtn = document.getElementById("deleteBtn");
      const submitBtn = document.getElementById("submitBtn");
      const goBackBtn = document.getElementById("goBackBtn");

      // VARIABLE TO TRACK THE CURRENT MODE
      let currentMode = "Search";

      // FUNCTION TO UPDATE STATUS INDICATOR
      function updateStatusIndicator(mode) {
        const statusIndicator = document.getElementById("statusIndicator");
        currentMode = mode;
        if (mode) {
          statusIndicator.style.display = "block"; // Show the indicator
          statusIndicator.textContent = `Current Mode: ${mode}`;
        } else {
          statusIndicator.style.display = "none"; // Hide the indicator
        }
      }

      // INITIAL BUTTON STATES
      window.onload = () => {
        resetForm();
        resetButtons();
        updateStatusIndicator("Search"); // Set initial state to Search
      };

      // FUNCTION TO RESET FORM
      function resetForm() {
        for (let key in formFields) {
          formFields[key].value = "";
          if (key === "studentId") {
            formFields[key].disabled = false; // ENABLE MEMBER ID
          } else {
            formFields[key].disabled = true; // DISABLE OTHER FIELDS
          }
        }
      }

      // FUNCTION TO RESET BUTTON STATES
      function resetButtons() {
        searchBtn.style.display = "inline-block";
        addBtn.style.display = "inline-block";
        editBtn.style.display = "inline-block";
        deleteBtn.style.display = "inline-block";
        submitBtn.style.display = "none";
        goBackBtn.style.display = "none";
        submitBtn.disabled = true; // Disable submit by default
      }

      // FUNCTION TO ENABLE/DISABLE SUBMIT BASED ON FIELD COMPLETION
      function toggleSubmitBasedOnFields() {
        submitBtn.disabled = Object.values(formFields).some(
          (field) => field.id !== "mid" && field.value.trim() === ""
        );
      }

      // FUNCTION TO HANDLE ADD BUTTON
      addBtn.addEventListener("click", () => {
        resetForm();
        updateStatusIndicator("Add"); // Update status
        for (let key in formFields) {
          if (key !== "studentId") {
            formFields[key].disabled = false; // ENABLE ALL FIELDS EXCEPT MEMBER ID
          }
        }
        addBtn.style.display = "none";
        editBtn.style.display = "none";
        deleteBtn.style.display = "none";
        searchBtn.style.display = "none";
        goBackBtn.style.display = "inline-block";
        submitBtn.style.display = "inline-block"; // SHOW SUBMIT BUTTON

        // Attach input listeners to enable Submit when all fields are filled
        Object.values(formFields).forEach((field) => {
          if (field.id !== "mid") {
            field.addEventListener("input", toggleSubmitBasedOnFields);
          }
        });
      });

      // FUNCTION TO HANDLE EDIT BUTTON
      editBtn.addEventListener("click", () => {
        resetForm();
        updateStatusIndicator("Edit"); // Update status
        addBtn.style.display = "none";
        editBtn.style.display = "none";
        deleteBtn.style.display = "none";
        searchBtn.style.display = "inline-block";
        goBackBtn.style.display = "inline-block";
        submitBtn.style.display = "none";

        formFields.studentId.disabled = false; // Enable Member ID
        for (let key in formFields) {
          if (key !== "studentId") formFields[key].disabled = true;
        }
      });

      // FUNCTION TO HANDLE DELETE BUTTON
      deleteBtn.addEventListener("click", () => {
        resetForm();
        updateStatusIndicator("Delete"); // Update status
        addBtn.style.display = "none";
        editBtn.style.display = "none";
        deleteBtn.style.display = "none";
        searchBtn.style.display = "inline-block";
        goBackBtn.style.display = "inline-block";
        submitBtn.style.display = "none";

        formFields.studentId.disabled = false; // Enable Member ID
        for (let key in formFields) {
          if (key !== "studentId") formFields[key].disabled = true;
        }
      });
      //wafi function get
      function getMember() {
        let id = document.getElementById("mid").value;
        fetch("/data/members/" + id)
          .then((res) => res.json())
          .then((data) => {
            {
              document.getElementById("first-name").value = data.FIRST_NAME;
              document.getElementById("last-name").value = data.LAST_NAME;
              document.getElementById("email").value = data.EMAIL;
              document.getElementById("phone").value = data.PHONE;
              document.getElementById("role").value = data.ROLE_NAME;
            }
          });
      }

      // FUNCTION TO HANDLE SEARCH BUTTON
      searchBtn.addEventListener("click", () => {
        const id = formFields.studentId.value.trim();
        if (!id) {
          alert("Please enter a valid Member ID."); // Show pop-up if ID is empty
          return;
        }
        getMember();
        // FETCH MEMBER DATA BASED ON CURRENT MODE
        /*
        fetch(`/data/members/${id}`)
          .then((res) => {
            if (!res.ok) throw new Error(`Member with ID ${id} not found.`);
            return res.json();
          })
          .then((member) => {
            formFields.firstName.value = member.FIRST_NAME;
            formFields.lastName.value = member.LAST_NAME;
            formFields.email.value = member.EMAIL;
            formFields.phone.value = member.PHONE;
            formFields.role.value = member.ROLE_NAME;

            if (currentMode === "Edit") {
              for (let key in formFields) {
                if (key !== "studentId") formFields[key].disabled = false; // Enable all except Member ID
              }
              submitBtn.style.display = "inline-block"; // Show Submit
            } else if (currentMode === "Delete") {
              for (let key in formFields) {
                formFields[key].disabled = true; // All fields are non-editable
              }
              submitBtn.style.display = "inline-block"; // Show Submit
            }
          })
          .catch((error) => alert(error.message));*/
      });

      // CONFIRM DELETION ON SUBMIT IN DELETE MODE
      submitBtn.addEventListener("click", () => {
        if (currentMode === "Delete") {
          const id = formFields.studentId.value.trim();
          if (confirm("Are you sure you want to delete this member?")) {
            fetch(`/data/members/${id}`, { method: "DELETE" })
              .then((res) => {
                if (!res.ok)
                  throw new Error("Failed to delete member. Please try again.");
                alert("Member deleted successfully.");
                resetForm();
                resetButtons();
                updateStatusIndicator("Search");
              })
              .catch((error) => alert(error.message));
          }
        }
      });

      // FUNCTION TO HANDLE GO BACK BUTTON
      goBackBtn.addEventListener("click", () => {
        resetForm();
        resetButtons();
        updateStatusIndicator("Search"); // Reset to Search mode
      });
    </script>
  </body>
</html>
