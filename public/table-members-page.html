    />

  </head>
  <body>
    <header>
      <div class="container-fluid mt-4">
          <div class="row">
              <div class="col-3">
                  <a href="index.html"><img class="W-logo ms-3" src="images/966f4bce-da5d-47d8-bdd4-c0e5f6291a68.jpeg"></a>
              </div>
              <div class="col-3"></div>
                  <div class="col-6 align-content-center">
                      <div class="W-containernav">
                          <div class="W-navbox">
                              <nav>
                                  <a href="index.html" >Home</a>
                                  <a href="aboutus.html">About Us</a>
                                  <a href="contactus.html" target="_blank">Contact Us</a>
                                  <a href="registeration-page.html" target="_blank">Join Us</a>
                                  <a href="signin-page.html" target="_blank">Sign In</a>
                              </nav>
                          </div>
                      </div>
                  </div>
              </div>
          </div>
      </div>
  </header>
    <div class="flex-col" style="height: 90vh">
      <h2 class="h2 text-light">Members List</h2>
      <div class="container" id="table-holder"></div>
      <hr />
     <div class="text-center">

       <div class="row">
         <div class="col p-0 me-2 mt-2 btn btn-outline-light">Add Member</div>
         <div class="col p-0 ms-2 mt-2 btn btn-danger">Remove Member</div>
       </div>
       </div>
       <ul class="pagination mt-6 m-0 text-center p-0">
        <li class="page-item">
          <a href="table-members-page.html" class="page-link bg-dark text-light"><div class="text-center" style="width: 100px; font-size: 11px;">&lt; Members</div></a>
        </li>
        <li class="page-item">
          <a href="table-events-page.html" class="page-link bg-dark text-light"><div class="text-center" style="width: 100px;font-size: 11px;">Events &gt;</div></a>
        </li>
      </ul>
     </div>
     </div>
    
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script>
      getMembersData();

      function getMembersData(){
        fetch('/data/members')
        .then(res => res.json())
        .then( data => {
          let htmlString = `<tr><th>MID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th></tr>`
          for(d in data){
            htmlString += `<tr>
              <td>${data[d].MEMBER_ID}</td>
              <td>${data[d].FIRST_NAME} ${data[d].LAST_NAME}</td>
              <td>${data[d].EMAIL}</td>
              <td>${data[d].PHONE}</td>
              <td>${data[d].ROLE_NAME}</td></tr>`
          }
          document.getElementById('table-holder').innerHTML = `<table class="table table-striped table-hover bg-light">${htmlString}</table>`
        } )
      }

      function getMember(){
        let id = document.getElementById('mid').value
        fetch('/data/members/' + id)
        .then(res => res.json())
        .then( data => {
          {
            document.getElementById('first-name').value = data.FIRST_NAME
            document.getElementById('last-name').value = data.LAST_NAME
            document.getElementById('email').value = data.EMAIL
            document.getElementById('phone').value = data.PHONE
            document.getElementById('role').value = data.ROLE_NAME
          }
          })

          
        }
      

      function updateMember(){
        let id = document.getElementById('mid').value
        fetch('/data/members/' + id, {
          method: PUT,
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            first_name: document.getElementById('first-name').value,
            last_name: document.getElementById('last-name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            role_name: document.getElementById('role').value
          })
        })
      }

      function deleteMember(){
        let id = document.getElementById('mid').value
        fetch('/data/members/' + id, {
          method: DELETE
        })
      }
    </script>
  </body>
</html>
