        <input

        />
      </a>

      <button style="width: 7rem" onclick="signIn()" class="btn btn-outline-light mt-4">

      <p id="invalid_msg" class="text-danger"></p>

    <script>
      function signIn(){
        //Hint:
        //username : admin
        //password : admin
        let acc = {
          username : document.getElementById('username').value,
          password : document.getElementById('password').value
        }
        fetch('/data/login', {
          method : 'POST',
          body : JSON.stringify(acc),
          headers:{'Content-type':'application/json'}
        }).then(res => res.json())
          .then(data =>{
            let empty =[];
            if(data.length>0){
              window.location.replace('http://localhost:3000/dashboard-page.html')
              console.log('User found');
              
            }
            else{
              document.getElementById('invalid_msg').innerHTML='Invalid username or password'
            }
        })




      }
    </script>
