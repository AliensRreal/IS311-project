<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Sign-in</title>
  </head>
  <body class="text-center flex-row">
    <div class="container flex-col bg-dark a-sign-box">
      <h2 class="h3 m-3 text-light">Admin Dashboard</h2>
      <h3 class="h4 mb-3 text-light">Sign in</h3>
      <form class="m-2" action="">
        <input
          type="text"
          class="form-control mb-3"
          name="username"
          placeholder="Username"
          id="user"
        />
        <input
          type="password"
          class="form-control"
          name="Password"
          placeholder="Password"
          id="pass"
        />
        <button style="width: 7rem" class="btn btn-outline-light mt-4">
          Sign in
        </button>
      </form>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
