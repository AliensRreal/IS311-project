                    <h2 class="h3 text-center mb-4 text-uppercase fw-bold">

                <div class="card-body text-dark m-3 p-3" style="flex: 2">
                  <h2 class="h4 text-start mb-4 text-center">Send Us A Message</h2>
                  <form class="mt-4">
                    <div class="row mb-3">
                      <div class="col-md-6">
                        <label class="form-label">First Name *</label>
                        <input
                          type="text"
                          class="form-control"
                          placeholder="First name"
                          required
                        />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Last Name *</label>
                        <input
                          type="text"
                          class="form-control"
                          placeholder="Last name"
                          required
                        />
                      </div>
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Enter Your Email *</label>
                      <input
                        type="email"
                        class="form-control"
                        placeholder="Eg. example@email.com"
                        required
                      />
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Enter Phone Number *</label>
                      <input
                        type="tel"
                        class="form-control"
                        placeholder="Eg. +1 800 000000"
                        required
                      />
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Message *</label>
                      <textarea
                        class="form-control"
                        rows="4"
                        placeholder="Write us a message"
                        required
                      ></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                      Send Message
                    </button>
                  </form>
                </div>
